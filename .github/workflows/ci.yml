name: CI

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4 
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore -c Release
      
      - name: Check vulnerable packages
        run: |  
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Phat hien package co lo hong bao mat"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install
        run: npm ci
      
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
      
      - name: Build
        run: npm run build

  images:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    env:
      GIT_SHA: ${{ github.sha }}
      POSTGRES_PASSWORD: not-used-during-build
    
    steps: 
      - uses: actions/checkout@v4
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: docker compose build api web migrate

      - name: Push images (one at a time)
        run: |
          for svc in api web migrate; do
            docker push "ghcr.io/sytombk/crud-demo-${svc}:${TAG}"
          done

  deploy:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://crud.103-226-249-201.sslip.io
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env: 
      APP_URL: https://crud.103-226-249-201.sslip.io
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup SSH
        env: 
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host crud
            HostName $SSH_HOST
            User deploy
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF
      
      - name: Upload compose file
        run: scp compose.yaml crud:/opt/crud-demo/compose.yaml

      - name: Deploy
        run: |
          ssh crud bash -s <<EOF
          set -euo pipefail
          cd /opt/crud-demo
          sed -i 's/^TAG=.*/TAG=${TAG}/' .env
          docker-compose pull --quiet
          docker-compose up -d --no-build
          docker-compose ps -a
          EOF
      - name: Verify deployed version
        run: |
          for i in $(seq 1 12); do
            version=$(curl -fsS "$APP_URL/api/info" | jq -r .version || true)
            echo "Lan thu $i: $version"
            if [[ "$version" == *"$GITHUB_SHA"* ]]; then
              echo "Server dang chay dung commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Sau 60 giay, server van chua chay commit $GITHUB_SHA"
          exit 1