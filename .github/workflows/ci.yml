name: CI

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4 
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore -c Release
      
      - name: Check vulnerable packages
        run: |  
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Phat hien package co lo hong bao mat"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install
        run: npm ci
      
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
      
      - name: Build
        run: npm run build

  images:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    env:
      GIT_SHA: ${{ github.sha }}
      POSTGRES_PASSWORD: not-used-during-build
    
    steps: 
      - uses: actions/checkout@v4
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: docker compose build api web migrate

      - name: Push images (one at a time)
        run: |
          for svc in api web migrate; do
            docker push "ghcr.io/sytombk/crud-demo-${svc}:${TAG}"
          done